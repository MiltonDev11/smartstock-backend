<!DOCTYPE html>
<!--
  Módulo: errores/404.html
  Descripción: Página de error 404 personalizada usada por el manejador
  de excepciones de la aplicación. Incluye estilo y un script para volver
  al inicio.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error 404 | SmartStock</title>
  <link rel="stylesheet" href="/static/errores/style_404.css">
</head>
<body>
  <div class="container">
    <h1>¡Uy!</h1>
    <h2>Ha ocurrido un error</h2>
    <h3 class="error-code">404</h3>
    <p class="message">La página que buscas no existe o fue movida.</p>
    <button onclick="irInicio()">IR AL INICIO</button>

    <div class="illustration">
      <img src="https://cdn-icons-png.flaticon.com/512/8340/8340376.png" alt="Persona arreglando una silla">
    </div>
  </div>

  <script src="/static/errores/script_404.js"></script>
</body>
</html>
