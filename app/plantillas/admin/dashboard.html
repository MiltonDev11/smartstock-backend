<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | SmartStock Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <button id="collapseBtn" class="collapse-btn"><i data-lucide="chevron-left"></i>
      </button>
      <div class="brand">
        <div class="logo">SS</div>
        <span class="name">SmartStock</span>
      </div>

      <ul class="menu">
          <li><button class="menu-btn active" onclick="location.href='/admin/dashboard'"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></button></li>
          <li><button class="menu-btn" onclick="location.href='/admin/solicitudes'"><i data-lucide="clipboard-list"></i><span>Solicitudes</span></button></li>
          <li><button class="menu-btn" onclick="location.href='/admin/gestion'"><i data-lucide="users"></i><span>Gestión</span></button></li>
          <li><button class="menu-btn" onclick="location.href='/admin/materiales'"><i data-lucide="box"></i><span>Materiales</span></button></li>
          <li><button class="menu-btn" onclick="location.href='/admin/reportes'"><i data-lucide="bar-chart-2"></i><span>Reportes</span></button></li>
          <li><button class="menu-btn" onclick="location.href='/admin/stock'"><i data-lucide="package"></i><span>Stock</span></button></li>
          <li><button class="menu-btn" onclick="location.href='/admin/supervisar'"><i data-lucide="check-circle"></i><span>Supervisar</span></button></li>
      </ul>

      <div class="sidebar-footer">SmartStock © 2025</div>
    </aside>

    <!-- MAIN AREA -->
    <main class="main-area">
      <!-- TOPBAR -->
      <header class="topbar">
        <div class="title-col">
          <h1 class="page-title">Bienvenido, Admin 👋</h1>
          <span class="page-sub">Panel principal de control</span>
        </div>

        <div class="controls">
          <!-- Campanita -->
          <div class="notif-btn" id="notifBtn" title="Ver avisos">
            <span class="notif-dot" id="notifDot"></span>
            <i data-lucide="bell"></i>
          </div>
        
          <!-- Dropdown de notificaciones -->
          <div class="notif-dropdown" id="notifDropdown" hidden>
            <div class="notif-header">
              <strong>Avisos recientes</strong>
              <div>
                <button class="btn ghost" id="clearNotifs">Limpiar</button>
                <button class="btn ghost" id="closeNotif">Cerrar</button>
              </div>
            </div>
            <ul class="notif-list" id="notifList"></ul>
          </div>
        
          <!-- Usuario -->
          <div class="admin-badge">
            <i data-lucide="user"></i>
            <span>Administrador</span>
          </div>
        </div>
      </header>

      <!-- CONTENIDO -->
      <section class="container-card">
        <div class="card-head">
          <h3>¿Qué deseas hacer hoy?</h3>
        </div>

        <!-- Accesos rápidos -->
        <div class="grid-3">
          <div class="container-card" onclick="location.href='solicitudes.html'" style="cursor:pointer;">
            <div class="kpi">
              <span class="value">📋</span>
              <span class="label">Solicitudes</span>
            </div>
          </div>

          <div class="container-card" onclick="location.href='gestion.html'" style="cursor:pointer;">
            <div class="kpi">
              <span class="value">⚙️</span>
              <span class="label">Gestión</span>
            </div>
          </div>

          <div class="container-card" onclick="location.href='materiales.html'" style="cursor:pointer;">
            <div class="kpi">
              <span class="value">🪵</span>
              <span class="label">Materiales</span>
            </div>
          </div>

          <div class="container-card" onclick="location.href='reportes.html'" style="cursor:pointer;">
            <div class="kpi">
              <span class="value">📊</span>
              <span class="label">Reportes</span>
            </div>
          </div>

          <div class="container-card" onclick="location.href='stock.html'" style="cursor:pointer;">
            <div class="kpi">
              <span class="value">📦</span>
              <span class="label">Stock</span>
            </div>
          </div>

          <div class="container-card" onclick="location.href='supervisar.html'" style="cursor:pointer;">
            <div class="kpi">
              <span class="value">🧰</span>
              <span class="label">Supervisar</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/admin/app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
